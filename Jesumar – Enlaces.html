<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jesumar – Fabricantes de ropa para niños</title>
<meta name="description" content="Jesumar fabrica guardapolvos, camisas, camperas y más ropa para niños. Escribinos por WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=Playfair+Display:wght@800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--fg:#17121c;--muted:#5d5566;--pink:#e5167e;--on-pink:#fff;--line:#e9d9e2;--card:#fdf1f7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0b10;--fg:#fff;--muted:#bdb4c7;--pink:#ff3c8e;--on-pink:#0d0b10;--line:#3a2c38;--card:#1a1420}}
:root[data-theme="dark"]{--bg:#0d0b10;--fg:#fff;--muted:#bdb4c7;--pink:#ff3c8e;--on-pink:#0d0b10;--line:#3a2c38;--card:#1a1420}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
main{max-width:480px;margin:0 auto;padding-bottom:40px}
.hero{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;background:#000}
.logo{display:block;width:96px;height:96px;border-radius:50%;border:4px solid var(--bg);margin:-48px auto 0;position:relative;object-fit:cover}
h1{font-family:"Playfair Display",Georgia,"Times New Roman",serif;font-weight:800;font-size:2.4rem;letter-spacing:.04em;text-align:center;margin:12px 0 4px}
.sub{text-align:center;margin:0;font-weight:700;font-size:1.05rem}
.items{text-align:center;color:var(--muted);margin:4px 24px 28px}
.links{display:grid;gap:12px;padding:0 20px;margin:0;list-style:none}
.btn{display:flex;align-items:center;gap:14px;min-height:58px;padding:0 20px;border-radius:14px;border:2px solid var(--pink);color:var(--fg);text-decoration:none;font-weight:700;font-size:1.1rem}
.btn svg{width:26px;height:26px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.main{background:var(--pink);color:var(--on-pink)}
.btn:hover{background:var(--card)}
.btn.main:hover{filter:brightness(1.08);background:var(--pink)}
.btn:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
.loc{margin:28px 20px 0;padding:16px 18px;border-radius:14px;background:var(--card);border:1px solid var(--line);text-align:center}
.loc p{margin:0}
.loc a{color:var(--fg);font-weight:700;text-underline-offset:3px}
.loc a:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
</style>
</head>
